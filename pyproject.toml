[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens"
version = "1.1.1"
description = "BERT-powered research paper summarizer: paste an arXiv/PDF link, get a structured, measured summary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["nlp", "bert", "summarization", "research papers", "arxiv", "gradio"]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "tabulate>=0.9",
  "torch>=2.0", "transformers>=4.40", "pypdf>=4.0", "rouge-score>=0.1.2", "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "reportlab>=4.0"]

[project.scripts]
paperlens = "paperlens.cli:main"
paperlens-app = "paperlens.ui:main"

[tool.setuptools]
packages = ["paperlens"]
